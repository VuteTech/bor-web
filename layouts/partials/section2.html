{{- $s        := .Site.Params.section2 }}
{{- $title    := index $s "title" }}
{{- $subtitle := index $s "subtitle" }}
{{- $features := index $s "features" }}
<section class="section is-medium" id="section2">
  <div class="container">
    <div class="has-text-centered mb-40">
      <h2 class="title section-title">{{ $title }}</h2>
      <h3 class="subtitle is-5 is-muted">{{ $subtitle }}</h3>
      <div class="divider"></div>
    </div>
    <div class="columns is-multiline">
      {{- range $features }}
      <div class="column is-6">
        <article class="media icon-box">
          <figure class="media-left">
            <p class="image">
              <img src="{{ printf "images/illustrations/icons/%s.svg" .icon | relURL }}">
            </p>
          </figure>
          <div class="media-content">
            <div class="content">
              <p>
                <span class="icon-box-title">{{ .title }}</span>
                <span class="icon-box-text">{{ .text | markdownify }}</span>
              </p>
            </div>
          </div>
        </article>
      </div>
      {{- end }}
    </div>
  </div>
</section>
