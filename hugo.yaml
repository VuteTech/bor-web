baseURL: https://getbor.dev/
languageCode: en-us
title: Bor

module:
  imports:
    - path: github.com/StefMa/hugo-fresh

disableKinds:
  - taxonomy

markup:
  goldmark:
    renderer:
      unsafe: true

enableRobotsTXT: true

params:
  openGraph: true
  description: Enterprise Linux Desktop Policy Management System
  navbarlogo:
    image: logos/bor.svg
    link: /
  font:
    name: "Open Sans"
    sizes: [400, 600]
  hero:
    title: Policy management for Linux desktops
    subtitle: Define, distribute, and enforce desktop configuration policies across your fleet — in real time. Open source, secure by default, built for enterprise Linux.
    buttontext: Get Started
    buttonlink: /download/
    image: bor-start.png
  navbar:
    - title: Download
      url: /download/
    - title: Docs
      url: /docs/
    - title: Screenshots
      url: /screenshots/
    - title: Blog
      url: /blog/
  githubFollow: https://github.com/VuteTech/bor
  section1:
    title: How it works
    subtitle: A central server, lightweight agents, real-time streaming
    tiles:
      - title: Centralized management
        icon: mouse-globe
        text: Author and manage policies from a web console built with PatternFly. Organize nodes into groups and control access with RBAC.
        url: /docs/server/
        buttonText: Learn more
      - title: Real-time delivery
        icon: laptop-cloud
        text: Policies stream to agents over gRPC the moment they change. Delta sync minimizes bandwidth; snapshot fallback guarantees consistency.
        url: /docs/architecture/
        buttonText: Learn more
      - title: Secure by default
        icon: plug-cloud
        text: mTLS with an auto-generated internal CA. One-time token enrollment. No shared secrets, no polling, no plaintext.
        url: /docs/agent/
        buttonText: Learn more
  section2:
    title: Built for enterprise Linux
    subtitle: Lightweight, native, and open source
    features:
      - title: Zero-touch enrollment
        text: "On domain-joined machines, agents enroll automatically using their Kerberos ticket — no tokens, no manual steps. For machines outside a domain, a short-lived one-time token generated from the web UI is used instead. Either way, mTLS certificates are exchanged automatically after the initial authentication and stored securely on the agent."
        icon: laptop-globe
      - title: Real-time policy delivery
        text: Policies reach every enrolled node the moment they are published. Persistent gRPC streams and delta sync keep bandwidth minimal and guarantee consistency — even across thousands of nodes or through network interruptions.
        icon: doc-sync
      - title: Compliance without complexity
        text: Every policy change, authentication event, and enforcement action is recorded in a tamper-evident audit log. Built-in RBAC, LDAP/AD integration, and support for Kerberos and WebAuthn align access controls with your existing directory services — ready for compliance reviews out of the box.
        icon: plug-cloud
      - title: Simple to deploy and operate
        text: A single server binary backed by PostgreSQL, and a single lightweight agent. No message queues, no sidecars, no external dependencies. Install from a native package, manage with systemd — from zero to your first enrolled node in minutes.
        icon: mouse-globe
  section4:
    title: Project Status
    subtitle: "What's built, what's in progress, and what's next"
    columns:
      - title: Done
        color: done
        items:
          - Policy CRUD with draft / released / archived lifecycle
          - gRPC streaming — delta sync and snapshot fallback
          - Compliance reporting with per-item results
          - Node status dashboard and fleet overview
          - "Policies: Firefox, Chrome, KDE/KConfig, dconf, polkit"
          - LDAP / AD with group-to-role mapping
          - Kerberos (SPNEGO) — primary agent authentication, alternative to enrollment tokens
          - WebAuthn / Passkey — web UI login
          - PKCS#11 / HSM support for CA private keys
          - Prometheus metrics endpoint
          - Audit log with configurable retention
          - RBAC — predefined roles, scope-aware
          - "Packages: .deb .rpm .apk .pkg.tar.zst, multi-arch"
          - Tamper protection — managed file modifications trigger audit log alerts
          - mTLS connectivity between the server and the agents
      - title: In Progress
        color: progress
        items:
          - Multi-tenancy (RBAC scopes done, per-org data isolation pending)
          - ACME / Let's Encrypt support for web UI TLS
      - title: Planned
        color: planned
        items:
          - systemd, package, and network policy types
          - Flatpak and package management support
          - Management of XDG Desktop portals
          - FirewallD policy type
          - Agent auto-update mechanism
          - Policy templates library
  footer:
    logo: logo-white.svg
    bulmalogo: false
    quicklinks:
      column1:
        title: "Project"
        links:
          - text: Download
            link: /download/
          - text: Architecture
            link: /docs/architecture/
          - text: Contributing
            link: /docs/contributing/
      column2:
        title: "Documentation"
        links:
          - text: Server
            link: /docs/server/
          - text: Agent
            link: /docs/agent/
          - text: GitHub
            link: https://github.com/VuteTech/bor/tree/master/docs
      column3:
        title: "Community"
        links:
          - text: GitHub
            link: https://github.com/VuteTech/bor
            icon: github
          - text: YouTube
            link: https://www.youtube.com/@getbor
            icon: youtube-play
          - text: Blog
            link: /blog/
            icon: rss
